name: Regression Run

on:
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  playwright-image:
    name: Resolve Playwright image
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      image: ${{ steps.resolve.outputs.image }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: package-lock.json
          sparse-checkout-cone-mode: false

      - name: Read the @playwright/test version from the lockfile
        id: resolve
        run: |
          version=$(jq -er '.packages["node_modules/@playwright/test"].version' package-lock.json)
          echo "image=mcr.microsoft.com/playwright:v${version}-noble" >> "$GITHUB_OUTPUT"

  regression:
    permissions:
      contents: read
      actions: write
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    runs-on: ubuntu-latest
    needs: playwright-image
    container:
      image: ${{ needs.playwright-image.outputs.image }}
      # Firefox needs to create a user namespace for its sandbox; the default
      # seccomp profile on the job container blocks the clone() syscall (EPERM).
      options: --security-opt seccomp=unconfined
    env:
      # The container runs as root, but Actions forces HOME=/github/home (owned by
      # the image's pwuser); Firefox refuses to start as root under another user's
      # HOME. Point HOME at a root-owned dir to resolve the mismatch.
      HOME: /root
      # Image installs browsers here; pin it so resolution is HOME-independent.
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      # Flakemetry upload — fail-open: uploads only when both are set, never fails the run.
      FLAKEMETRY_ENDPOINT: ${{ secrets.FLAKEMETRY_ENDPOINT }}
      FLAKEMETRY_TOKEN: ${{ secrets.FLAKEMETRY_TOKEN }}
      FLAKEMETRY_PROJECT: akogut/playwright-ecommerce-framework
      BASE_URL: https://www.saucedemo.com/
      STANDARD_USER_USERNAME: standard_user
      STANDARD_USER_PASSWORD: secret_sauce
      LOCKED_USER_USERNAME: locked_out_user
      LOCKED_USER_PASSWORD: secret_sauce
      PROBLEM_USER_USERNAME: problem_user
      PROBLEM_USER_PASSWORD: secret_sauce
      PERFORMANCE_USER_USERNAME: performance_glitch_user
      PERFORMANCE_USER_PASSWORD: secret_sauce
      SKIP_BASE_URL_HEALTHCHECK: false
      BASE_URL_HEALTHCHECK_RETRIES: 3
      BASE_URL_HEALTHCHECK_BACKOFF_MS: 2000
      GLOBAL_TIMEOUT_MS: 600000
      TEST_TIMEOUT_MS: 30000
      EXPECT_TIMEOUT_MS: 5000
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run full regression tests (${{ matrix.browser }})
        run: npm run test:regression:${{ matrix.browser }}

      - name: Test run summary
        if: always()
        env:
          RUN_SUMMARY_LABEL: regression · ${{ matrix.browser }}
        run: node scripts/run-summary.mjs

      - name: Upload Flakemetry batch
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: flakemetry-${{ github.job }}-${{ matrix.browser }}
          path: test-results/flakemetry/
          retention-days: 90
          if-no-files-found: warn

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: allure-results-${{ github.job }}-${{ matrix.browser }}
          path: allure-results/
          retention-days: 30
          if-no-files-found: warn

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ github.job }}-${{ matrix.browser }}
          path: playwright-report/
          retention-days: 30
          if-no-files-found: warn

      - name: Upload test-results (failure media only)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ github.job }}-${{ matrix.browser }}
          path: test-results/
          retention-days: 30
          if-no-files-found: warn

  allure-report:
    name: Allure HTML report
    needs: [regression]
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    outputs:
      has_report: ${{ steps.merge.outputs.has_report }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download Allure raw results
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          pattern: allure-results-regression-*
          path: downloaded
          merge-multiple: false

      - name: Merge results and generate Allure HTML
        id: merge
        run: |
          set -euo pipefail
          mkdir -p allure-results
          if [ -d downloaded ]; then
            find downloaded -type f -exec cp -f {} allure-results/ \;
          fi
          count="$(find allure-results -type f 2>/dev/null | wc -l | tr -d ' ')"
          if [ "${count:-0}" -eq 0 ]; then
            echo "has_report=false" >> "$GITHUB_OUTPUT"
            echo "No Allure result files; skipping report generation."
            exit 0
          fi
          npx allure generate ./allure-results --output ./allure-report
          echo "has_report=true" >> "$GITHUB_OUTPUT"

      - name: Upload Allure HTML report bundle
        if: steps.merge.outputs.has_report == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: allure-report-bundle
          path: allure-report/
          retention-days: 30

  triage:
    name: Triage a failed run
    needs: [regression]
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    env:
      BASE_URL: https://www.saucedemo.com/
    steps:
      - name: Probe the application under test
        id: probe
        run: |
          set -uo pipefail
          code="$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 --retry 2 "$BASE_URL" || echo 000)"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" = "200" ]; then
            echo "verdict=suite" >> "$GITHUB_OUTPUT"
            echo "detail=The site answered 200, so the failure is in the suite rather than the environment." >> "$GITHUB_OUTPUT"
          else
            echo "verdict=outage" >> "$GITHUB_OUTPUT"
            echo "detail=The site answered $code. The failure most likely reflects the demo site being unavailable, not a regression in the suite." >> "$GITHUB_OUTPUT"
          fi

      - name: Open or update the triage issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          VERDICT: ${{ steps.probe.outputs.verdict }}
          DETAIL: ${{ steps.probe.outputs.detail }}
          HTTP_CODE: ${{ steps.probe.outputs.code }}
        run: |
          set -euo pipefail
          title="Nightly regression failed"
          body=$(printf '%s\n' \
            "The scheduled regression run did not pass." \
            "" \
            "- Run: $RUN_URL" \
            "- Application under test: \`$BASE_URL\` returned HTTP \`$HTTP_CODE\`" \
            "- Likely cause: **$VERDICT**" \
            "" \
            "$DETAIL" \
            "" \
            "This issue is reopened and commented on by each failing nightly run, and is closed by hand once the cause is resolved.")
          existing="$(gh issue list --state open --search "$title in:title" --json number --jq '.[0].number // empty')"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$title" --body "$body" --label "ci" 2>/dev/null \
              || gh issue create --title "$title" --body "$body"
          fi
