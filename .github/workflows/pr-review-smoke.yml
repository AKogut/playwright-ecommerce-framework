name: Smoke Run

on:
  pull_request_review:
    types: [submitted]
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  critical:
    if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request' || (github.event_name == 'pull_request_review' && (github.event.review.state == 'approved' || github.event.review.state == 'changes_requested' || github.event.review.state == 'commented')) }}
    permissions:
      contents: read
      actions: write
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium]
    runs-on: ubuntu-latest
    # Official Playwright image ships browsers + OS dependencies preinstalled, so no
    # `playwright install` step is needed (avoids the extract-zip hang on Node 24 in
    # Playwright < 1.60). Keep the tag in sync with @playwright/test in package.json.
    container:
      image: mcr.microsoft.com/playwright:v1.59.1-noble
      # Firefox needs to create a user namespace for its sandbox; the default
      # seccomp profile on the job container blocks the clone() syscall (EPERM).
      options: --security-opt seccomp=unconfined
    env:
      # The container runs as root, but Actions forces HOME=/github/home (owned by
      # the image's pwuser); Firefox refuses to start as root under another user's
      # HOME. Point HOME at a root-owned dir to resolve the mismatch.
      HOME: /root
      # Image installs browsers here; pin it so resolution is HOME-independent.
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      BASE_URL: https://www.saucedemo.com/
      STANDARD_USER_USERNAME: standard_user
      STANDARD_USER_PASSWORD: secret_sauce
      LOCKED_USER_USERNAME: locked_out_user
      LOCKED_USER_PASSWORD: secret_sauce
      PROBLEM_USER_USERNAME: problem_user
      PROBLEM_USER_PASSWORD: secret_sauce
      PERFORMANCE_USER_USERNAME: performance_glitch_user
      PERFORMANCE_USER_PASSWORD: secret_sauce
      SKIP_BASE_URL_HEALTHCHECK: false
      BASE_URL_HEALTHCHECK_RETRIES: 3
      BASE_URL_HEALTHCHECK_BACKOFF_MS: 2000
      GLOBAL_TIMEOUT_MS: 600000
      TEST_TIMEOUT_MS: 30000
      EXPECT_TIMEOUT_MS: 5000
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run critical tests (${{ matrix.browser }})
        run: npm run test:critical:${{ matrix.browser }}

      - name: Test run summary
        if: always()
        env:
          RUN_SUMMARY_LABEL: ${{ github.job }} · ${{ matrix.browser }}
        run: node scripts/run-summary.mjs

      - name: Upload run JSON (dashboard input)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: run-json-${{ github.job }}-${{ matrix.browser }}
          path: test-results/json/results.json
          retention-days: 14
          if-no-files-found: warn

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: allure-results-${{ github.job }}-${{ matrix.browser }}
          path: allure-results/
          retention-days: 14
          if-no-files-found: warn

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ github.job }}-${{ matrix.browser }}
          path: playwright-report/
          retention-days: 14
          if-no-files-found: warn

      - name: Upload test-results (failure media only)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ github.job }}-${{ matrix.browser }}
          path: test-results/
          retention-days: 14
          if-no-files-found: warn

      - name: Flaky test detection report
        if: always()
        env:
          FAIL_ON_FLAKY: true
        run: npm run report:flaky

  smoke:
    if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request' || (github.event_name == 'pull_request_review' && (github.event.review.state == 'approved' || github.event.review.state == 'changes_requested' || github.event.review.state == 'commented')) }}
    permissions:
      contents: read
      actions: write
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    runs-on: ubuntu-latest
    # Official Playwright image ships browsers + OS dependencies preinstalled, so no
    # `playwright install` step is needed (avoids the extract-zip hang on Node 24 in
    # Playwright < 1.60). Keep the tag in sync with @playwright/test in package.json.
    container:
      image: mcr.microsoft.com/playwright:v1.59.1-noble
      # Firefox needs to create a user namespace for its sandbox; the default
      # seccomp profile on the job container blocks the clone() syscall (EPERM).
      options: --security-opt seccomp=unconfined
    env:
      # The container runs as root, but Actions forces HOME=/github/home (owned by
      # the image's pwuser); Firefox refuses to start as root under another user's
      # HOME. Point HOME at a root-owned dir to resolve the mismatch.
      HOME: /root
      # Image installs browsers here; pin it so resolution is HOME-independent.
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      BASE_URL: https://www.saucedemo.com/
      STANDARD_USER_USERNAME: standard_user
      STANDARD_USER_PASSWORD: secret_sauce
      LOCKED_USER_USERNAME: locked_out_user
      LOCKED_USER_PASSWORD: secret_sauce
      PROBLEM_USER_USERNAME: problem_user
      PROBLEM_USER_PASSWORD: secret_sauce
      PERFORMANCE_USER_USERNAME: performance_glitch_user
      PERFORMANCE_USER_PASSWORD: secret_sauce
      SKIP_BASE_URL_HEALTHCHECK: false
      BASE_URL_HEALTHCHECK_RETRIES: 3
      BASE_URL_HEALTHCHECK_BACKOFF_MS: 2000
      GLOBAL_TIMEOUT_MS: 600000
      TEST_TIMEOUT_MS: 30000
      EXPECT_TIMEOUT_MS: 5000
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run smoke tests (${{ matrix.browser }})
        run: npm run test:smoke:${{ matrix.browser }}

      - name: Test run summary
        if: always()
        env:
          RUN_SUMMARY_LABEL: ${{ github.job }} · ${{ matrix.browser }}
        run: node scripts/run-summary.mjs

      - name: Upload run JSON (dashboard input)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: run-json-${{ github.job }}-${{ matrix.browser }}
          path: test-results/json/results.json
          retention-days: 14
          if-no-files-found: warn

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: allure-results-${{ github.job }}-${{ matrix.browser }}
          path: allure-results/
          retention-days: 14
          if-no-files-found: warn

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ github.job }}-${{ matrix.browser }}
          path: playwright-report/
          retention-days: 14
          if-no-files-found: warn

      - name: Upload test-results (failure media only)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ github.job }}-${{ matrix.browser }}
          path: test-results/
          retention-days: 14
          if-no-files-found: warn

      - name: Flaky test detection report
        if: always()
        env:
          FAIL_ON_FLAKY: true
        run: npm run report:flaky

  api:
    if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request' || (github.event_name == 'pull_request_review' && (github.event.review.state == 'approved' || github.event.review.state == 'changes_requested' || github.event.review.state == 'commented')) }}
    permissions:
      contents: read
      actions: write
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    runs-on: ubuntu-latest
    # Official Playwright image ships browsers + OS dependencies preinstalled, so no
    # `playwright install` step is needed (avoids the extract-zip hang on Node 24 in
    # Playwright < 1.60). Keep the tag in sync with @playwright/test in package.json.
    container:
      image: mcr.microsoft.com/playwright:v1.59.1-noble
      # Firefox needs to create a user namespace for its sandbox; the default
      # seccomp profile on the job container blocks the clone() syscall (EPERM).
      options: --security-opt seccomp=unconfined
    env:
      # The container runs as root, but Actions forces HOME=/github/home (owned by
      # the image's pwuser); Firefox refuses to start as root under another user's
      # HOME. Point HOME at a root-owned dir to resolve the mismatch.
      HOME: /root
      # Image installs browsers here; pin it so resolution is HOME-independent.
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      BASE_URL: https://www.saucedemo.com/
      STANDARD_USER_USERNAME: standard_user
      STANDARD_USER_PASSWORD: secret_sauce
      LOCKED_USER_USERNAME: locked_out_user
      LOCKED_USER_PASSWORD: secret_sauce
      PROBLEM_USER_USERNAME: problem_user
      PROBLEM_USER_PASSWORD: secret_sauce
      PERFORMANCE_USER_USERNAME: performance_glitch_user
      PERFORMANCE_USER_PASSWORD: secret_sauce
      SKIP_BASE_URL_HEALTHCHECK: false
      BASE_URL_HEALTHCHECK_RETRIES: 3
      BASE_URL_HEALTHCHECK_BACKOFF_MS: 2000
      GLOBAL_TIMEOUT_MS: 600000
      TEST_TIMEOUT_MS: 30000
      EXPECT_TIMEOUT_MS: 5000
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run API tests (${{ matrix.browser }})
        run: npm run test:api:${{ matrix.browser }}

      - name: Test run summary
        if: always()
        env:
          RUN_SUMMARY_LABEL: ${{ github.job }} · ${{ matrix.browser }}
        run: node scripts/run-summary.mjs

      - name: Upload run JSON (dashboard input)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: run-json-${{ github.job }}-${{ matrix.browser }}
          path: test-results/json/results.json
          retention-days: 14
          if-no-files-found: warn

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: allure-results-${{ github.job }}-${{ matrix.browser }}
          path: allure-results/
          retention-days: 14
          if-no-files-found: warn

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ github.job }}-${{ matrix.browser }}
          path: playwright-report/
          retention-days: 14
          if-no-files-found: warn

      - name: Upload test-results (failure media only)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ github.job }}-${{ matrix.browser }}
          path: test-results/
          retention-days: 14
          if-no-files-found: warn

      - name: Flaky test detection report
        if: always()
        env:
          FAIL_ON_FLAKY: true
        run: npm run report:flaky

  report:
    name: Build report site
    needs: [critical, smoke, api]
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    outputs:
      has_site: ${{ steps.build.outputs.has_site }}
    env:
      # Live Pages base — used to seed trend/history from the previous deploy.
      PAGES_BASE: https://akogut.github.io/playwright-ecommerce-framework
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download Allure raw results
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          pattern: allure-results-*
          path: downloaded-allure
          merge-multiple: false

      - name: Download run JSON reports
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          pattern: run-json-*
          path: downloaded-json
          merge-multiple: false

      - name: Build combined site (dashboard + Allure)
        id: build
        run: |
          set -euo pipefail
          mkdir -p site allure-results/history

          # Living dashboard at the site root; seed its trend from the last deploy
          # so the sparkline and recent-runs table carry forward (fail-open on 404).
          curl -fsSL "$PAGES_BASE/trend.json" -o prev-trend.json || echo "[]" > prev-trend.json
          DASHBOARD_INPUT_DIR=downloaded-json DASHBOARD_OUT_DIR=site \
            DASHBOARD_PREV_TREND=prev-trend.json ALLURE_HREF=./allure/ \
            node scripts/build-dashboard.mjs

          # Allure report under /allure, with history carried over for trend graphs.
          allure_count=0
          if [ -d downloaded-allure ]; then
            find downloaded-allure -type f -exec cp -f {} allure-results/ \;
            allure_count="$(find allure-results -maxdepth 1 -type f | wc -l | tr -d ' ')"
          fi
          for f in history.json history-trend.json duration-trend.json categories-trend.json retry-trend.json; do
            curl -fsSL "$PAGES_BASE/allure/history/$f" -o "allure-results/history/$f" \
              || curl -fsSL "$PAGES_BASE/history/$f" -o "allure-results/history/$f" || true
          done
          if [ "${allure_count:-0}" -gt 0 ]; then
            npx allure generate ./allure-results --output ./site/allure
          else
            echo "No Allure result files; publishing the dashboard without the Allure report."
          fi
          echo "has_site=true" >> "$GITHUB_OUTPUT"

      - name: Upload site bundle
        if: steps.build.outputs.has_site == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: site-bundle
          path: site/
          retention-days: 14

  deploy-pages:
    name: Deploy to GitHub Pages
    needs: [report]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.report.outputs.has_site == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: github-pages
      cancel-in-progress: false
    permissions:
      actions: write
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download site bundle
        uses: actions/download-artifact@v8
        with:
          name: site-bundle
          path: _site

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v5
