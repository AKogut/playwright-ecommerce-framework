name: Code Quality Checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  lint-and-format:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run TypeScript type check
        run: npm run typecheck
      - name: Run ESLint
        run: npm run lint
      - name: Run Prettier check
        run: npm run format

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Report moderate and low advisories
        if: always()
        run: |
          set -euo pipefail
          summary="$(npm audit --audit-level=low 2>&1 || true)"
          if printf '%s' "$summary" | grep -q 'found 0 vulnerabilities'; then
            echo "No advisories against the dependency tree." >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "### Dependency advisories below the failure threshold"
              echo
              echo '```'
              printf '%s\n' "$summary" | tail -n 20
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
