name: Dependabot auto-merge

on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    name: Enable auto-merge
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read the update metadata
        id: metadata
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Enable auto-merge for minor and patch updates
        if: steps.metadata.outputs.update-type != 'version-update:semver-major'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Leave major updates for review
        if: steps.metadata.outputs.update-type == 'version-update:semver-major'
        run: |
          {
            echo "### Left for manual review"
            echo
            echo "\`${{ steps.metadata.outputs.dependency-names }}\` is a major update"
            echo "(\`${{ steps.metadata.outputs.update-type }}\`), so auto-merge was not enabled."
          } >> "$GITHUB_STEP_SUMMARY"
